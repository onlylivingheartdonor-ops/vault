<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vault">
<title>Vault</title>
<link rel="icon" href="/img/vault.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/vault-180.png">
<link rel="manifest" href="/manifest.json">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () {
    var m = 'dark';
    try { m = JSON.parse(localStorage.getItem('vault:theme')) || 'dark'; } catch (e) {}
    if (m === 'system') m = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = m;
  })();
</script>
<link rel="stylesheet" href="/css/vault.css">
</head>
<body>
<noscript>Vault needs JavaScript turned on.</noscript>
<script type="module" src="/js/app.js"></script>
</body>
</html>
